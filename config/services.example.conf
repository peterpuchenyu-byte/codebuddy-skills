# 服务清单: name|servers|日志目录模式|日志glob|备注|repo|module|dir|artifact|deployMode|kind|verifyUrl|packageManager
#
# 前 5 列只用于只读诊断(health/logs/grep/count/nginx-stats 等)。
# 后 8 列仅在"允许变更"的环境下使用, 用于 plan/build/upload/restart/verify。
#
# 占位符: {svc} -> 服务名; {host} -> 服务器的"内网IP或备注"字段
# 旧格式只有前 5 列或 10 列也可以, 缺省 kind=jar。
#
# 复制本文件为 services-<env>.conf 后填入真实信息。
#
# 只读诊断示例(5 列):
gateway-web|web-01|/opt/{svc}/logs|*.log|Nginx 与门户
order-api|app-01,app-02|/opt/{svc}/logs|app.*.log|订单服务
#
# 含发版能力示例(13 列):
order-api|app-01,app-02|/opt/{svc}/logs|app.*.log|订单服务|/path/to/repo|order-server|/opt/{svc}|order-server.jar|systemd|jar|http://127.0.0.1:8080/actuator/health|
