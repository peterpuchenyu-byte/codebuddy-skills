# 服务器清单: name|host|user|私钥路径|内网IP或备注|描述
#
# 私钥路径支持 ~ 展开为当前用户主目录。
# 私钥文件本身不要放进仓库, 也不要在任何输出中回显其内容。
#
# 复制本文件为 servers-<env>.conf 后填入真实信息。
#
# 示例:
web-01|203.0.113.10|deploy|~/.ssh/id_ed25519|10.0.0.11|Nginx 与门户
app-01|203.0.113.11|deploy|~/.ssh/id_ed25519|10.0.0.12|核心服务
app-02|203.0.113.12|deploy|~/.ssh/id_ed25519|10.0.0.13|核心服务
